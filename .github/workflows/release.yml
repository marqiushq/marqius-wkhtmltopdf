name: release

# Builds marqius-wkhtmltopdf on GitHub's own machines from one commit of its engine, gives every
# program GitHub's build provenance and a software bill of materials (SBOM), checks both as a
# customer would, and publishes the programs as a GitHub Release. Anyone can check a file:
#
#   gh attestation verify marqius-wkhtmltopdf-linux-x86_64 -R marqiushq/marqius-wkhtmltopdf
#
# Built ahead: every tested engine commit is built here as soon as it is pushed (Run workflow with
# its full hash in `engine`; the engine's tools/download-tests/run.py --build-ahead does it). Such a
# run builds, attests and checks; it publishes nothing. Agent37 then tests what it made and keeps
# the tested images ready (run.py --release --from-github RUN --hold).
# A release: put the engine commit in release/engine and the notes in release/notes.md, commit,
# and push the tag vX.Y.Z (it must match the engine's version). When a build ahead of that commit
# exists (and its files are still kept), the tag builds nothing again: its release is made from
# those very files, so it takes minutes. The release is made as a draft; it is made public once
# Agent37 has published the tested images to Docker Hub.
#
# The engine's source is private. It is read with a read-only key (ENGINE_DEPLOY_KEY), and
# its repository's name is a secret too (ENGINE_REPO). This repository's logs are public, so
# the build's own output stays on the machine: a failed build says only where it stopped.
run-name: ${{ github.ref_type == 'tag' && format('release {0}', github.ref_name) || format('build {0}', inputs.engine || 'release/engine') }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      engine:
        description: "The engine commit to build ahead (its full hash); empty: release/engine"
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engine:
    # The engine commit this run is about, and on a tag the build ahead of it, if one is kept
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.which.outputs.commit }}
      reuse: ${{ steps.ahead.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The engine commit
        id: which
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          commit=${ENGINE:-$(tr -d ' \n' < release/engine)}
          echo "$commit" | grep -Eq '^[0-9a-f]{40}$' || { echo "the engine commit must be one full hash"; exit 1; }
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "engine commit $commit"
      - name: A build ahead of it, still kept (a tag only)
        id: ahead
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.which.outputs.commit }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?status=success&per_page=50" \
                --jq ".workflow_runs[] | select(.display_title == \"build $COMMIT\") | .id" | head -1)
          if [ -n "$run" ] && gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '[.artifacts[] | select(.expired | not)] | length' | grep -qx '[5-9]'; then
            echo "run=$run" >> "$GITHUB_OUTPUT"
            echo "the release is made from build run $run: nothing is built again"
          else
            echo "no build ahead of $COMMIT is kept: this run builds it"
          fi

  build:
    name: build ${{ matrix.name }}
    needs: engine
    if: needs.engine.outputs.reuse == ''
    strategy:
      fail-fast: true
      matrix:
        include:
          # every program is compiled on Linux, cross-compiled with zig: GitHub's Macs are often
          # not to be had, and the macOS program needs none (see release/macos.Dockerfile)
          - { name: linux-x86_64, os: ubuntu-24.04, kind: docker, dockerfile: Dockerfile.wkhtmltopdf, target: out, platform: linux/amd64, file: marqius-wkhtmltopdf }
          - { name: linux-arm64, os: ubuntu-24.04, kind: docker, dockerfile: Dockerfile.wkhtmltopdf, target: out, platform: linux/arm64, file: marqius-wkhtmltopdf }
          - { name: windows-x86_64.exe, os: ubuntu-24.04, kind: docker, dockerfile: Dockerfile.wkhtmltopdf, target: windows, platform: linux/amd64, file: marqius-wkhtmltopdf.exe }
          - { name: macos-arm64, os: ubuntu-24.04, kind: docker, dockerfile: ../release/macos.Dockerfile, target: '', platform: linux/amd64, file: marqius-wkhtmltopdf }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The engine commit this run builds
        id: engine
        run: echo "commit=${{ needs.engine.outputs.commit }}" >> "$GITHUB_OUTPUT"

      - name: The engine's source (read-only key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.ENGINE_REPO }}
          ref: ${{ steps.engine.outputs.commit }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          path: engine
          persist-credentials: false

      - name: Its version, which a tag must match
        id: version
        run: |
          v=$(sed -n 's/^version *= *"\(.*\)"/\1/p' engine/Cargo.toml | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "marqius-wkhtmltopdf $v, engine commit ${{ steps.engine.outputs.commit }}"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "the tag is $GITHUB_REF_NAME but the engine is $v"; exit 1
          fi

      # The 445 libraries marqius uses are compiled once and kept between runs in GitHub's cache, so a
      # build compiles marqius itself and little else. What is kept depends only on the Rust image and
      # on the libraries Cargo.lock names, not on marqius's own version line, which moves every release.
      - name: A builder, and the libraries it keeps between runs
        if: matrix.kind == 'docker'
        id: keep
        working-directory: engine
        env:
          NAME: ${{ matrix.name }}
        run: |
          docker buildx create --name rel --driver docker-container --use --bootstrap > /dev/null 2>&1
          rust=$(docker buildx imagetools inspect rust:1-alpine | awk '/^Digest:/ {print $2; exit}' | cut -d: -f2 | cut -c1-12)
          libs=$(sed '/^name = "marqius"$/{N;d;}' Cargo.lock | sha256sum | cut -c1-16)
          case "$NAME" in
            macos-*) id=marqius-wkhtmltopdf-target-macos ;;
            windows-*) id=marqius-wkhtmltopdf-target-windows ;;
            *) id=marqius-wkhtmltopdf-target ;;
          esac
          {
            echo "prefix=rel-$NAME-$rust-"
            echo "key=rel-$NAME-$rust-$libs"
            echo "map={\"keep/registry\":{\"target\":\"/usr/local/cargo/registry\",\"id\":\"/usr/local/cargo/registry\"},\"keep/target\":{\"target\":\"/src/target\",\"id\":\"$id\"}}"
          } >> "$GITHUB_OUTPUT"
          echo "Rust image $rust, libraries $libs"

      - name: The compiled libraries, from earlier runs
        if: matrix.kind == 'docker'
        id: kept
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: keep
          key: ${{ steps.keep.outputs.key }}
          restore-keys: ${{ steps.keep.outputs.prefix }}

      - name: The compiled libraries, put in the builder (and kept again after a change)
        if: matrix.kind == 'docker'
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: rel
          cache-map: ${{ steps.keep.outputs.map }}
          skip-extraction: ${{ steps.kept.outputs.cache-hit }}

      - name: GitHub's cache, for the builder's own steps
        if: matrix.kind == 'docker'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build with Docker, as the images are built
        if: matrix.kind == 'docker'
        working-directory: engine
        env:
          V: ${{ steps.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        run: |
          if ! docker buildx build -f "${{ matrix.dockerfile }}" --build-arg MARQIUS_VERSION="$V" \
               --platform "$PLATFORM" ${TARGET:+--target "$TARGET"} -o "type=local,dest=$RUNNER_TEMP/out" \
               --cache-from "type=gha,scope=rel-$NAME" --cache-to "type=gha,mode=max,scope=rel-$NAME,ignore-error=true" \
               --progress plain . > "$RUNNER_TEMP/build.log" 2>&1; then
            echo "The build failed. Its log stays on the machine; where it stopped:"
            grep -E '^ERROR|^#[0-9]+ ERROR' "$RUNNER_TEMP/build.log" | cut -c1-160 | tail -3
            exit 1
          fi
          # where the time went, by Dockerfile step (no build output: it stays on the machine)
          awk 'match($0, /^#[0-9]+ \[[a-z-]+ [0-9]+\/[0-9]+\]/) { id = $1; lab = substr($0, RSTART + length(id) + 1, RLENGTH - length(id) - 1); name[id] = lab; next }
               /^#[0-9]+ DONE [0-9.]+s$/ { id = $1; t = $3; sub(/s$/, "", t); if ((id in name) && t + 0 >= 3) printf "  %-14s %7.1f s\n", name[id], t }
               /^#[0-9]+ CACHED$/ { if ($1 in name) printf "  %-14s    kept\n", name[$1] }' "$RUNNER_TEMP/build.log"
          echo "  crates compiled in this run: $(grep -c ' Compiling ' "$RUNNER_TEMP/build.log")"
          mkdir -p ../dist && cp "$RUNNER_TEMP/out/${{ matrix.file }}" "../dist/marqius-wkhtmltopdf-${{ matrix.name }}"

      - name: It runs and says its version
        if: matrix.name == 'linux-x86_64'
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/try" && cp "dist/marqius-wkhtmltopdf-${{ matrix.name }}" "$RUNNER_TEMP/try/marqius-wkhtmltopdf"
          said=$("$RUNNER_TEMP/try/marqius-wkhtmltopdf" --version)
          echo "$said"
          [ "$said" = "marqius-wkhtmltopdf $V" ]

      - name: Size, kind and SHA-256
        run: |
          f="dist/marqius-wkhtmltopdf-${{ matrix.name }}"
          file -b "$f" | cut -c1-70
          echo "$(wc -c < "$f" | tr -d ' ') bytes, sha256 $(shasum -a 256 "$f" | cut -c1-64)"

      - name: GitHub's build provenance for this program
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/marqius-wkhtmltopdf-${{ matrix.name }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/marqius-wkhtmltopdf-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 7

  images:
    # The six Docker images, for both chips, made from the two Linux programs built above (the
    # Dockerfile's image stages only copy files), with BuildKit's full provenance and SBOM inside,
    # and GitHub's build provenance for each image by its digest. They leave as OCI archives:
    # Agent37 loads them unchanged (the digests stay), tests them, and copies them to Docker Hub,
    # where `gh attestation verify oci://marqius/wkhtmltopdf:TAG -R marqiushq/marqius-wkhtmltopdf`
    # checks them.
    needs: [engine, build]
    if: needs.engine.outputs.reuse == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The engine commit
        id: engine
        run: echo "commit=${{ needs.engine.outputs.commit }}" >> "$GITHUB_OUTPUT"

      - name: The engine's Dockerfile and demo files only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.ENGINE_REPO }}
          ref: ${{ steps.engine.outputs.commit }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          path: engine
          persist-credentials: false
          sparse-checkout: |
            Cargo.toml
            Dockerfile.wkhtmltopdf
            .dockerignore
            src/wk/demo/
          sparse-checkout-cone-mode: false

      - name: Version
        id: version
        run: echo "version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' engine/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: programs
          merge-multiple: true

      - name: The two Linux programs, checked by their own provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for chip in x86_64:amd64 arm64:arm64; do
            f="programs/marqius-wkhtmltopdf-linux-${chip%%:*}"
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" > /dev/null
            mkdir -p "bins/${chip##*:}" && cp "$f" "bins/${chip##*:}/marqius-wkhtmltopdf" && chmod +x "bins/${chip##*:}/marqius-wkhtmltopdf"
            echo "$(basename "$f"): provenance verified"
          done

      - name: Every image for both chips, with full provenance and an SBOM
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          docker run -d --name reg -p 127.0.0.1:5000:5000 registry:2 > /dev/null
          printf '[registry."localhost:5000"]\n  http = true\n  insecure = true\n' > buildkitd.toml
          docker buildx create --name img --driver docker-container --driver-opt network=host --config buildkitd.toml --use --bootstrap > /dev/null 2>&1
          printf 'FROM scratch\nARG TARGETARCH\nCOPY ${TARGETARCH}/marqius-wkhtmltopdf /out/marqius-wkhtmltopdf\n' > bins/Dockerfile
          docker buildx build --platform linux/amd64,linux/arm64 --provenance=false -t "localhost:5000/bins:$V" --push bins > bins.log 2>&1 || { tail -5 bins.log; exit 1; }
          mkdir -p oci
          for v in latest slim alpine trixie bookworm bullseye; do
            (cd engine && docker buildx build -f Dockerfile.wkhtmltopdf --build-arg MARQIUS_VERSION="$V" \
              --platform linux/amd64,linux/arm64 --target "$v" --build-context "build=docker-image://localhost:5000/bins:$V" \
              --provenance=mode=max --sbom=true -o "type=oci,dest=../oci/$v.tar" . > "../image-$v.log" 2>&1) || { tail -5 "image-$v.log"; exit 1; }
            d=$(tar -xOf "oci/$v.tar" index.json | jq -r '.manifests[0].digest')
            echo "${d#sha256:}  marqius/wkhtmltopdf:$v" >> oci/digests.txt
            echo "$v: $d, $(wc -c < "oci/$v.tar" | tr -d ' ') bytes"
          done

      - name: GitHub's build provenance for each image, by its digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: oci/digests.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: oci/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [engine, build, images]
    # after this run's own build, or (a tag with a build ahead kept) from that build's files
    if: always() && needs.engine.result == 'success' && (needs.engine.outputs.reuse != '' || (needs.build.result == 'success' && needs.images.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The engine commit
        id: engine
        run: echo "commit=${{ needs.engine.outputs.commit }}" >> "$GITHUB_OUTPUT"

      - name: The engine's Cargo.toml and Cargo.lock only, for the SBOM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ secrets.ENGINE_REPO }}
          ref: ${{ steps.engine.outputs.commit }}
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
          path: engine
          persist-credentials: false
          sparse-checkout: |
            Cargo.toml
            Cargo.lock
          sparse-checkout-cone-mode: false

      - name: Version
        id: version
        run: echo "version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' engine/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # the programs only (linux-*, macos-*, windows-*): the images go to Docker Hub, not here;
          # from this run, or from the build ahead (its provenance comes with its files)
          pattern: '*-*'
          path: dist
          merge-multiple: true
          run-id: ${{ needs.engine.outputs.reuse || github.run_id }}
          github-token: ${{ github.token }}

      - run: mkdir -p sbom

      - name: The software bill of materials, from the engine's Cargo.lock
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: engine
          format: spdx-json
          output-file: sbom/marqius-wkhtmltopdf-${{ steps.version.outputs.version }}.spdx.json
          upload-artifact: false

      - name: The SBOM attested for every program
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/marqius-wkhtmltopdf-*
          sbom-path: sbom/marqius-wkhtmltopdf-${{ steps.version.outputs.version }}.spdx.json

      - name: Each program checked with GitHub, as a customer would check it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=0
          for f in dist/marqius-wkhtmltopdf-*; do
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" > /dev/null
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" --predicate-type https://spdx.dev/Document/v2.3 > /dev/null
            echo "$(basename "$f"): provenance and SBOM verified"
            n=$((n + 1))
          done
          [ "$n" = 4 ] || { echo "expected 4 programs, found $n"; exit 1; }

      - name: Checksums
        run: |
          cd dist
          sha256sum marqius-wkhtmltopdf-* > ../SHA256SUMS
          for f in marqius-wkhtmltopdf-*; do sha256sum "$f" > "$f.sha256"; done
          mv ../SHA256SUMS . && cp ../sbom/*.spdx.json . && cat SHA256SUMS

      # a draft, not yet public: Agent37 tests these very files and images first (run.py --release
      # --from-github RUN --push), then the release is made public (gh release edit TAG --draft=false)
      - name: The release, as a draft (a tag only; a rehearsal stops here)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "marqius-wkhtmltopdf $V" --notes-file release/notes.md --verify-tag dist/*
